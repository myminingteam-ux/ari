name: Package Vercel ZIP
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment root
        run: |
          test -f index.html
          test -f styles.css
          test -f script.js
          test -f vercel.json
          grep -qi '<!doctype html>' index.html
      - uses: actions/upload-artifact@v4
        with:
          name: victory-consultancy-vercel-fixed
          path: |
            index.html
            styles.css
            script.js
            vercel.json
            README.md
          if-no-files-found: error
