name: Package Vercel ZIP
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build deployment archive
        run: |
          zip -r victory-consultancy-approved-vercel.zip index.html styles.css script.js vercel.json README.md
      - uses: actions/upload-artifact@v4
        with:
          name: victory-consultancy-approved-vercel
          path: victory-consultancy-approved-vercel.zip
          if-no-files-found: error
